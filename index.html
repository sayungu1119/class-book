<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級電子聯絡簿</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --bg-color: #F4F7F9;
            --card-bg: #FFFFFF;
            --text-color: #333333;
            --accent-color: #E74C3C;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            background: var(--primary-color);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0 0 8px 0;
            font-size: 1.5rem;
        }

        .date-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-block;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            color: #2C3E50;
            border-bottom: 2px solid #EAECEE;
            padding-bottom: 8px;
        }

        /* 每日作業清單 */
        .homework-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .homework-item {
            display: flex;
            align-items: flex-start;
            padding: 8px 0;
            border-bottom: 1px dashed #EAECEE;
        }

        .homework-item:last-child {
            border-bottom: none;
        }

        .tag {
            background: #E8F4FC;
            color: var(--primary-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-right: 10px;
            white-space: nowrap;
        }

        /* 注意事項 */
        .notice-list {
            padding-left: 20px;
            margin: 0;
        }

        .notice-item {
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .notice-item strong {
            color: var(--accent-color);
        }

        footer {
            text-align: center;
            color: #7F8C8D;
            font-size: 0.85rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 標頭區 -->
    <header>
        <h1>五年三班 電子聯絡簿</h1>
        <div class="date-badge" id="current-date">載入日期中...</div>
    </header>

    <!-- 每日作業 -->
    <div class="card">
        <div class="card-title">📝 今日作業</div>
        <ul class="homework-list" id="homework-container">
            <!-- 由 JavaScript 動態生成 -->
        </ul>
    </div>

    <!-- 重要注意事項 -->
    <div class="card">
        <div class="card-title">📢 重要事項通知</div>
        <ol class="notice-list" id="notice-container">
            <!-- 由 JavaScript 動態生成 -->
        </ol>
    </div>

    <footer>
        <p>如有問題請透過官方 Line 或導師電話聯繫</p>
    </footer>
</div>

<script>
    // 1. 自動顯示今日日期
    const today = new Date();
    const dateOptions = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
    document.getElementById('current-date').innerText = today.toLocaleDateString('zh-TW', dateOptions);

    // 2. 每日作業資料 (每天更新這裡)
    const homeworkData = [
        { subject: '國語', content: '國語課本第六到第十一遍 ㄅ-ㄦ 念一遍' }
    ];

    // 3. 注意事項資料 (每天更新這裡)
    const noticeData = [
        "本周一、三、四、五為<strong>半天課程</strong>，請中午十二點四十接送孩子。",
        "今日發下入學禮物，歡迎加入來吉國小大家庭。"
    ];

    // 渲染作業
    const hwContainer = document.getElementById('homework-container');
    homeworkData.forEach(item => {
        const li = document.createElement('li');
        li.className = 'homework-item';
        li.innerHTML = `<span class="tag">${item.subject}</span><span>${item.content}</span>`;
        hwContainer.appendChild(li);
    });

    // 渲染注意事項
    const noticeContainer = document.getElementById('notice-container');
    noticeData.forEach(item => {
        const li = document.createElement('li');
        li.className = 'notice-item';
        li.innerHTML = item;
        noticeContainer.appendChild(li);
    });
</script>

</body>
</html>
